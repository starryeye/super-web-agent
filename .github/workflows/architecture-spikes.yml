name: architecture-spikes

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - "spikes/**"
      - ".github/workflows/architecture-spikes.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "spikes/**"
      - ".github/workflows/architecture-spikes.yml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  runtime-artifact:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spikes:verify
      - run: pnpm -C spikes build:runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-artifact-${{ runner.os }}-${{ runner.arch }}
          path: spikes/.artifacts/packaging/

  artifact-decision:
    if: always()
    needs: runtime-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: runtime-artifact-*
          path: spikes/.artifacts/packaging
          merge-multiple: true
      - run: >-
          pnpm -C spikes write:artifact-decision
          ../docs/decisions/0002-runtime-artifact-spike.md
          .artifacts/packaging/darwin-arm64/packaging-report.json
          .artifacts/packaging/win32-x64/packaging-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-artifact-decision
          path: docs/decisions/0002-runtime-artifact-spike.md
